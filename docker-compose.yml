services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: signatures
      POSTGRES_USER: signatures
      POSTGRES_PASSWORD: signatures
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signatures -d signatures"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://signatures:signatures@postgres:5432/signatures?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
