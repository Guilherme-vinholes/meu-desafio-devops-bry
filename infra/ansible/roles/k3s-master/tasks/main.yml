---
# Traefik e desabilitado porque o Nginx Ingress Controller e instalado explicitamente
# via manifests em k8s/ingress/ (ver docs/adr) — evita dois ingress controllers concorrendo.
- name: Instalar K3s server (control-plane)
  ansible.builtin.shell: |
    curl -sfL https://get.k3s.io | \
      INSTALL_K3S_VERSION="{{ k3s_version }}" \
      INSTALL_K3S_EXEC="server --disable traefik --write-kubeconfig-mode 644" \
      sh -
  args:
    creates: /usr/local/bin/k3s

- name: Aguardar o node-token ficar disponivel
  ansible.builtin.wait_for:
    path: /var/lib/rancher/k3s/server/node-token
    timeout: 120

- name: Ler o node-token do cluster
  ansible.builtin.slurp:
    src: /var/lib/rancher/k3s/server/node-token
  register: node_token_raw

- name: Expor o token como fato (visivel aos workers via hostvars nesta mesma execucao)
  ansible.builtin.set_fact:
    k3s_node_token: "{{ node_token_raw.content | b64decode | trim }}"

- name: Buscar kubeconfig para a maquina de controle (kubectl local)
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ playbook_dir }}/../../kubeconfig-prod.yaml"
    flat: true

- name: Apontar o kubeconfig local para o IP publico do master
  ansible.builtin.lineinfile:
    path: "{{ playbook_dir }}/../../kubeconfig-prod.yaml"
    regexp: '^\s*server:'
    line: "    server: https://{{ inventory_hostname }}:6443"
  delegate_to: localhost
  become: false
