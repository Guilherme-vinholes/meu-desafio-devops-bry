server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Mesma logica de roteamento que o Ingress vai aplicar em producao:
    # /api/* vai para o servico da API, o resto e conteudo estatico.
    # Isso evita CORS (mesma origem) tanto local quanto no cluster.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
