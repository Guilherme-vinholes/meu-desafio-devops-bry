# Values para o chart prometheus-community/kube-prometheus-stack, ajustado para
# caber nos recursos modestos das instancias EC2 deste desafio (t3.small/t3.micro).
# Grafana NUNCA e exposto publicamente (sem Ingress aqui de proposito) - acesso via
# `kubectl port-forward`, conforme a decisao de seguranca em docs/adr.

grafana:
  enabled: true
  adminPassword: "" # defina via --set no install, nunca commitado aqui
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 200m
      memory: 192Mi
  service:
    type: ClusterIP

prometheus:
  prometheusSpec:
    retention: 3d
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 512Mi

alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 20m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
  # Sem receiver externo configurado (nenhum webhook/SMTP/Slack disponivel neste
  # desafio) - o Alertmanager roda com o receiver "null" default do chart, ou
  # seja, recebe e avalia os alertas do Prometheus mas nao notifica ninguem.
  # Em um ambiente real, seria so adicionar um `config.receivers` apontando para
  # o canal desejado (Slack/e-mail/PagerDuty); o mecanismo ja esta operacional.

# kube-prometheus-stack instala varios exporters/regras pesados por padrao;
# desabilitamos os que menos importam para uma API simples de 3 replicas.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
