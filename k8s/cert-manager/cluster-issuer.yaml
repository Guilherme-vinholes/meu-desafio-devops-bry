# Desafio HTTP-01: o cert-manager sobe um pod temporario respondido pelo proprio
# Ingress (ingressClassName: nginx) para provar ao Let's Encrypt que voce controla
# o dominio - por isso precisa ser aplicado depois do ingress-nginx e do DNS
# do dominio ja apontando para o cluster.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: SEU-EMAIL@dominio.com.br # trocar antes de aplicar
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
