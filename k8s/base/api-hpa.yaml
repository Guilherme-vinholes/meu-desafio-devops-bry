# HorizontalPodAutoscaler para a API - metrics-server ja vem embutido no K3s
# (nao precisa instalar separado). minReplicas mantem o piso de HA em 3
# (mesmo numero de nos do cluster); maxReplicas da folga para picos de carga.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  namespace: bry-desafio
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
