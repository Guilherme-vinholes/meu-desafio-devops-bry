apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: bry-desafio
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          # Publicada pelo pipeline de CI/CD (bry-007) no GitHub Container Registry.
          image: ghcr.io/guilherme-vinholes/meu-desafio-devops-bry-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
