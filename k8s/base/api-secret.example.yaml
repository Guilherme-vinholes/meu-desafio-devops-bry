# NAO aplicar este arquivo diretamente nem commitar a versao real.
# Copie para api-secret.yaml (gitignored) preenchendo DATABASE_URL com o
# db_endpoint que saiu do `terraform output` (infra/terraform) + credenciais
# do RDS, e aplique manualmente:
#
#   kubectl apply -f api-secret.yaml
#
apiVersion: v1
kind: Secret
metadata:
  name: api-db-credentials
  namespace: bry-desafio
type: Opaque
stringData:
  DATABASE_URL: "postgres://signatures:<SENHA>@<RDS_ENDPOINT>:5432/signatures?sslmode=require"
